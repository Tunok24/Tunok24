name: Build visitor map

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "package.json"
      - ".github/workflows/visitor-map.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Generate SVG map
        run: node scripts/build-map.mjs
        env:
          STATS_URL: "https://gitvisitstat.tunok-24.workers.dev/stats"

      - name: Commit updated map.svg
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update visitor map [skip ci]"
          file_pattern: "map.svg"
